<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Video TikTok</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
        }

        .video-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video controls poster="html.png">
            <source src="html.mp4" type="video/mp4">
            Tu navegador no soporta el elemento de video.
        </video>
    </div>
</body>
</html>
